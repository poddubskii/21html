<!DOCTYPE html>
<html>
  <head>
    <title>BlackJack21</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="game-container">
      <h1 class="pt-1">Black Jack 21</h1>
      <div id="dealer-area" class="card-row">
        <div id="dealer-head">
          <h3 id="dealer">Dealer</h3>
          <img src="/static/img/dealer.png" />
        </div>
      </div>
      <div id="cards_table">
        <div id="dealer-cards"></div>
        <h3 id="player">Player</h3>
        <div id="player-hands-container"></div>
      </div>
      <div id="player-area">
        <div id="controls">
          <input type="number" id="bet-input" value="10" min="10" />

          <button id="deal-btn"></button>

          <button id="hit-btn" disabled></button>

          <button id="stand-btn" disabled></button>

          <button id="split-btn" disabled></button>

          <button id="double-btn"></button>
        </div>
        <div id="status-bar">
          <span>Balance: $<span id="balance">1000</span></span>
          <span>Current bet: $<span id="current-bet">10</span></span>
        </div>
      </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  </body>
</html>
